<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abụ Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one phone running the app, with a guide panel beside it on wide screens.
   On phones the app fills the screen and the guide folds into a thin bar at the top. Single light theme on purpose. */
:root {
  color-scheme: light;
  --red: #D93A1E;
  --red-deep: #A3261A;
  --red-tint: #FCEAE5;
  --gold: #E6A325;
  --ink: #22160F;
  --muted: #76655C;
  --line: #E9DED8;
  --sand: #F7F1ED;
  --white: #FFFFFF;
  --board: #EDE4DE;
  --ok: #1C8173;
  --part-s: #D93A1E;
  --part-a: #C98410;
  --part-t: #1C8173;
  --part-b: #3A4AA6;
  --part-solo: #8A3FA0;
  --display: "Marcellus", Georgia, serif;
  --body: "Figtree", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--board); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* Stage */
.stage { min-height: 100%; display: flex; justify-content: center; align-items: flex-start; gap: 40px; padding: 28px 20px; }
.guide { width: 330px; display: flex; flex-direction: column; gap: 18px; padding-top: 10px; }
.brandline { display: flex; align-items: center; gap: 12px; }
.mark { width: 40px; height: 40px; border-radius: 10px; background: var(--red); color: var(--white); display: grid; place-items: center; flex: none; }
.mark svg { width: 24px; height: 24px; }
.wordmark { font-family: var(--display); font-size: 28px; letter-spacing: .04em; }
.guide h1 { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1.15; }
.guide p { margin: 0; color: var(--muted); }
.gpanel { background: var(--white); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.gpanel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.persona { display: flex; align-items: center; gap: 10px; border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 10px; background: var(--white); text-align: left; width: 100%; }
.persona.on { border-color: var(--ink); background: var(--sand); }
.persona b { display: block; font-size: 14px; color: var(--ink); }
.persona .avatar { color: var(--white); font-size: 13px; }
.persona span { font-size: 12px; color: var(--muted); }
.trylist { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--red-deep); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

.device { flex: none; }
.phone { width: 380px; height: 790px; max-height: calc(100vh - 40px); min-height: 640px; background: var(--white); border-radius: 44px; border: 10px solid #1d1714; box-shadow: 0 24px 50px -20px rgba(60,25,10,.5); overflow: hidden; display: flex; flex-direction: column; position: relative; }
.status { height: 30px; flex: none; display: flex; justify-content: space-between; align-items: center; padding: 0 24px; font-size: 12px; font-weight: 700; background: var(--white); }
.status.red { background: var(--red); color: var(--white); }
.status.dark { background: #140D0A; color: #fff; }
.protobar { display: none; }
#screen { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }

.phone.wide { width: min(860px, calc(100vw - 40px)); }
@media (max-width: 1260px) { .stage.wide .guide { display: none; } }
.wtools { display: flex; gap: 8px; align-items: center; }
.play.wplay { width: 46px; height: 46px; flex: none; box-shadow: none; }
.play.wplay svg { width: 20px; height: 20px; }
.wcanvases { display: flex; flex-direction: column; gap: 10px; }
canvas.wsys { display: block; width: 100%; touch-action: none; border-radius: 12px; background: #fff; border: 1px solid var(--line); cursor: crosshair; }
.wpre { font-family: var(--mono); font-size: 12px; line-height: 1.65; margin: 0; white-space: pre; overflow-x: auto; background: var(--sand); border-radius: 10px; padding: 8px 10px; }
.fixgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.fixgrid button { height: 50px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--white); font-family: var(--mono); font-size: 20px; font-weight: 700; }
.fixgrid button sub, .fixgrid button sup { font-size: 11px; }
@media (max-width: 760px) {
  .stage { padding: 0; display: block; height: 100%; }
  .guide { display: none; }
  .device { height: 100%; }
  .phone, .phone.wide { width: 100%; height: 100%; max-height: none; min-height: 0; border: 0; border-radius: 0; box-shadow: none; }
  .status { display: none; }
  .protobar { display: flex; flex: none; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 14px; background: var(--ink); color: #fff; font-size: 12px; }
  .protobar button { background: rgba(255,255,255,.14); border: 0; border-radius: 8px; padding: 4px 10px; color: #fff; font-weight: 700; font-size: 12px; }
}

/* App chrome */
.app { flex: 1; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; min-height: 0; }
.topbar { display: flex; align-items: center; gap: 10px; padding: 8px 16px 10px; }
.topbar h3 { font-size: 18px; font-weight: 800; flex: 1; line-height: 1.2; min-width: 0; }
.topbar .sub { display: block; font-size: 12.5px; color: var(--muted); font-weight: 500; }
.iconbtn { width: 38px; height: 38px; border-radius: 11px; border: 1px solid var(--line); background: var(--white); display: grid; place-items: center; flex: none; padding: 0; }
.iconbtn svg { width: 19px; height: 19px; }
.body { padding: 0 16px 20px; display: flex; flex-direction: column; gap: 12px; }
.tabbar { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); padding: 6px 4px 10px; background: var(--white); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11.5px; color: var(--muted); font-weight: 700; background: none; border: 0; padding: 4px 0; }
.tab svg { width: 23px; height: 23px; }
.tab.on { color: var(--red); }

.card { border-radius: 14px; border: 1px solid var(--line); background: var(--white); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; text-align: left; width: 100%; }
button.card:hover { border-color: #D7C7BE; }
.card.hero { background: var(--red); border-color: var(--red); color: var(--white); }
.card.hero .k { color: #FFD9CF; }
.card.hero .small { color: #FFE7E0; }
.card.sand { background: var(--sand); border-color: var(--sand); }
.k { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; font-weight: 800; color: var(--muted); }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; gap: 6px; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.title { font-weight: 700; font-size: 15px; line-height: 1.25; }
.small { font-size: 12.5px; color: var(--muted); }
.btn { border: 0; border-radius: 12px; padding: 12px 14px; font-weight: 800; font-size: 14.5px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: var(--red); color: var(--white); }
.btn.primary:hover { background: var(--red-deep); }
.btn.primary:disabled { background: #E3B5AA; cursor: not-allowed; }
.btn.light { background: var(--white); color: var(--red-deep); }
.btn.ghost { background: var(--white); border: 1.5px solid var(--line); color: var(--ink); }
.btn.outline-w { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.55); }
.btn.sm { padding: 7px 12px; font-size: 13px; border-radius: 10px; }
.btn.block { width: 100%; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chip { flex: none; border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; background: var(--white); }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--white); }
.search { display: flex; align-items: center; gap: 8px; border-radius: 12px; background: var(--sand); padding: 0 12px; }
.search svg { width: 17px; height: 17px; color: var(--muted); flex: none; }
.search input { border: 0; background: transparent; padding: 11px 0; flex: 1; min-width: 0; font-size: 15px; outline: none; }
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 12px; padding: 11px 0; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; width: 100%; }
.li:last-child { border-bottom: 0; }
.badge { font-size: 11.5px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: var(--sand); color: var(--muted); white-space: nowrap; border: 0; }
.badge.ok { background: #E1F2EE; color: var(--ok); }
.badge.warn { background: #FDF1D8; color: #8A5A00; }
.badge.red { background: var(--red-tint); color: var(--red-deep); }
.badge.dark { background: var(--ink); color: #fff; }
button.badge { cursor: pointer; padding: 6px 11px; font-size: 12.5px; min-width: 76px; }
.thumb { width: 42px; height: 42px; border-radius: 11px; background: var(--red-tint); color: var(--red-deep); display: grid; place-items: center; font-family: var(--mono); font-weight: 700; font-size: 13px; flex: none; }
.thumb.nosolfa { background: var(--sand); color: var(--muted); }
.thumb svg { width: 20px; height: 20px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; color: var(--white); flex: none; }
.ord { width: 28px; height: 28px; border-radius: 8px; background: var(--sand); display: grid; place-items: center; font-family: var(--mono); font-size: 12px; font-weight: 700; flex: none; }
.fab { position: absolute; right: 16px; bottom: 78px; box-shadow: 0 8px 20px -8px rgba(163,38,26,.7); z-index: 5; }
.empty { text-align: center; padding: 26px 10px; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.pp { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 24px; padding: 0 8px; border-radius: 7px; font-weight: 800; font-size: 12px; color: var(--white); }
.secthead { display: flex; justify-content: space-between; align-items: baseline; }

/* Forms */
.field { display: flex; flex-direction: column; gap: 5px; }
.field > label, .field > .lbltxt { font-size: 12px; font-weight: 800; color: var(--muted); }
.input, select.input, textarea.input { border: 1.5px solid var(--line); border-radius: 11px; padding: 10px 12px; font-size: 15px; background: var(--white); width: 100%; }
.input:focus { border-color: var(--ink); outline: none; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
textarea.code { font-family: var(--mono); font-size: 12.5px; line-height: 1.7; min-height: 210px; resize: vertical; white-space: pre; overflow-x: auto; }
.err { color: #9C2A10; font-size: 13px; font-weight: 600; }
.checks { display: flex; flex-direction: column; gap: 6px; }
.checks .bad { font-size: 13px; color: #8A2710; background: #FDEDE8; border-radius: 9px; padding: 7px 10px; }
.checks .warnline { font-size: 13px; color: #7A5200; background: #FDF4DF; border-radius: 9px; padding: 7px 10px; }
.opt { border: 1.5px solid var(--line); border-radius: 13px; padding: 11px 13px; background: var(--white); text-align: left; width: 100%; display: flex; align-items: center; gap: 10px; }
.opt.on { border: 2px solid var(--red); background: var(--red-tint); padding: 10.5px 12.5px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--sand); border-radius: 11px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; text-align: center; padding: 7px 0; font-size: 13px; font-weight: 800; border-radius: 9px; color: var(--muted); }
.seg button.on { background: var(--white); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.codebox { display: flex; gap: 6px; }
.codeinput { width: 100%; height: 54px; border-radius: 12px; background: rgba(255,255,255,.14); border: 1.5px solid rgba(255,255,255,.45); text-align: center; font-family: var(--mono); font-size: 24px; font-weight: 700; letter-spacing: .3em; color: #fff; text-transform: uppercase; }
.codeinput::placeholder { color: rgba(255,255,255,.5); }
.codeinput.dark { background: var(--sand); border-color: var(--line); color: var(--ink); }
.codeinput.dark::placeholder { color: #B9A79D; }
.switch { width: 42px; height: 24px; border-radius: 99px; background: #D8CCC5; border: 0; position: relative; padding: 0; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--white); transition: left .15s; }
.switch[aria-checked="true"] { background: var(--red); }
.switch[aria-checked="true"]::after { left: 21px; }

/* Welcome */
.welcome { flex: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 20px; padding: 28px 22px 22px; background: var(--red); color: var(--white); overflow-y: auto; }
.bigmark { width: 76px; height: 76px; border-radius: 19px; background: var(--white); color: var(--red); display: grid; place-items: center; }
.bigmark svg { width: 44px; height: 44px; }
.welcome h1 { font-family: var(--display); font-weight: 400; font-size: 52px; margin: 18px 0 6px; letter-spacing: .03em; line-height: 1; }
.welcome p { margin: 0; font-size: 17px; color: #FFE7E0; max-width: 24ch; }
.welcome .fine { font-size: 12.5px; color: #FFD9CF; text-align: center; }
.welcome .err { color: #fff; background: rgba(0,0,0,.18); border-radius: 9px; padding: 7px 10px; }

/* Score */
.score { display: flex; flex-direction: column; gap: 10px; }
.sechead { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--red-deep); margin-top: 2px; }
.system { display: grid; border-radius: 11px; background: var(--sand); padding: 7px 6px 5px 4px; row-gap: 1px; }
.lbl { font-size: 10px; font-weight: 800; display: grid; place-items: center; }
.cell { font-family: var(--mono); font-size: 12.5px; font-weight: 500; text-align: center; padding: 2px 0; position: relative; line-height: 1.4; white-space: nowrap; }
.cell sub, .cell sup { font-size: 8px; line-height: 0; }
.cell.hold { color: #B9A79D; }
.cell.bar0 { border-left: 1.5px solid #CDBEB5; }
.cell:not(.bar0)::before { content: ":"; position: absolute; left: -2px; color: #B9A79D; font-weight: 400; }
.cell.now { background: var(--red-tint); color: var(--red-deep); font-weight: 700; }
.cell.dim { opacity: .3; }
.lyr { font-size: 9.5px; color: var(--muted); white-space: nowrap; text-align: left; padding: 1px 0 3px 2px; overflow: visible; }
.lyr.now { color: var(--red-deep); font-weight: 800; }
.score.big .cell { font-size: var(--pf, 18px); padding: 4px 0; }
.score.big .cell sub, .score.big .cell sup { font-size: .6em; }
.score.big .lyr { font-size: calc(var(--pf, 18px) * .72); padding-bottom: 6px; }
.score.big .lbl { font-size: 13px; }
.score.big .sechead { font-size: 13px; }
.score.big .system { padding: 10px 8px 8px 6px; }

/* Player */
.mixer { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; }
.part { border-radius: 12px; border: 1.5px solid var(--line); background: var(--white); padding: 8px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; }
.part .pl { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: var(--white); font-weight: 800; font-size: 13px; border: 0; padding: 0; }
.part.muted .pl { background: #CDBEB5 !important; }
.part.muted { color: var(--muted); }
.part .sbtns { display: grid; gap: 3px; width: 100%; padding: 0 4px; }
.part .solo { border: 0; border-radius: 6px; padding: 3px 0; font-size: 10.5px; font-weight: 800; background: var(--sand); color: var(--muted); width: 100%; }
.part .solo.on { background: var(--ink); color: var(--white); }
.part.mine { border-color: var(--ink); }
.toggles { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; }
.transport { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.transport.sticky { position: sticky; bottom: 0; z-index: 3; background: var(--white); margin: 0 -16px; padding: 8px 16px 10px; border-top: 1px solid var(--line); }
.stepper { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.stepper .v { font-family: var(--mono); font-weight: 700; font-size: 15px; min-width: 30px; text-align: center; }
.stepper .l { font-size: 10.5px; color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
.stepper .ctr { display: flex; align-items: center; gap: 6px; }
.stepper button { width: 32px; height: 32px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--white); font-weight: 800; padding: 0; }
.play { width: 68px; height: 68px; border-radius: 50%; border: 0; background: var(--red); display: grid; place-items: center; box-shadow: 0 8px 18px -8px rgba(163,38,26,.8); }
.play:hover { background: var(--red-deep); }
.play svg { width: 28px; height: 28px; fill: var(--white); }
.hint { font-size: 12px; color: var(--muted); text-align: center; }

/* Perform */
.perform { flex: 1; background: #140D0A; color: #F7EDE7; display: flex; flex-direction: column; min-height: 0; }
.perform .app { padding: 10px 16px 16px; gap: 12px; }
.perform .k { color: #E8A592; }
.perform h2 { font-family: var(--display); font-weight: 400; font-size: 28px; line-height: 1.15; }
.perform .system { background: #24191449; background: #241914; }
.perform .cell { color: #F7EDE7; }
.perform .cell.hold, .perform .cell:not(.bar0)::before { color: #7D6A60; }
.perform .cell.bar0 { border-left-color: #5A4A42; }
.perform .cell.now { background: #5A1D10; color: #FFD2C4; }
.perform .lyr { color: #BFAEA5; }
.perform .lyr.now { color: #FF9B83; }
.perform .sheetonly { border: 1.5px dashed #5A4A42; border-radius: 12px; padding: 20px; text-align: center; color: #BFAEA5; }
.pnav { flex: none; display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; padding: 10px 16px 16px; border-top: 1px solid #33241D; }
.pnav .btn { background: #2B1E18; color: #F7EDE7; }
.pnav .btn:disabled { opacity: .35; }
.pnav .pos { font-family: var(--mono); font-weight: 700; color: #BFAEA5; font-size: 14px; text-align: center; }
.pctl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.pctl button { background: #2B1E18; color: #F7EDE7; border: 0; border-radius: 9px; padding: 6px 11px; font-weight: 800; font-size: 13px; }
.pctl button.on { background: #F7EDE7; color: #140D0A; }
.perform .lockline { font-size: 11.5px; color: #8E7A70; }
.rnav { display: flex; align-items: center; gap: 8px; background: var(--sand); border-radius: 12px; padding: 7px 8px 7px 12px; }
.pnav .play { width: 58px; height: 58px; }
.pctl .sep { width: 1px; height: 22px; background: #3A2B24; margin: 0 2px; }
/* Light performance theme: white page, black notes, for bright churches and halls */
.perform .psec { color: var(--gold); }
.perform.light { background: #FFFFFF; color: #140D0A; }
.perform.light .psec { color: var(--red); }
.perform.light .k { color: var(--red-deep); }
.perform.light .small { color: #5E4E46 !important; }
.perform.light .system { background: #F7F1ED; }
.perform.light .cell { color: #140D0A; }
.perform.light .cell.hold, .perform.light .cell:not(.bar0)::before { color: #A8968C; }
.perform.light .cell.bar0 { border-left-color: #BFAEA5; }
.perform.light .lyr { color: #3A2B24; }
.perform.light .sheetonly { border-color: #CDBEB5; color: #5E4E46; }
.perform.light .lockline { color: #8E7A70; }
.perform.light .pnav { border-top-color: var(--line); }
.perform.light .pnav .btn, .perform.light .pctl button { background: #F1E8E3; color: #140D0A; }
.perform.light .pctl button.on { background: #140D0A; color: #FFFFFF; }
.perform.light .pctl .sep { background: var(--line); }
.perform.light .pnav .pos { color: #5E4E46; }
.status.paper { background: #FFFFFF; color: var(--ink); }

/* Sheet + toast */
.scrim { position: absolute; inset: 0; background: rgba(34,22,15,.45); display: flex; align-items: flex-end; z-index: 20; }
.sheet { background: var(--white); width: 100%; border-radius: 22px 22px 0 0; padding: 8px 18px 22px; max-height: 88%; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.grab { width: 40px; height: 5px; border-radius: 9px; background: var(--line); margin: 0 auto 4px; }
.sheet h3 { font-size: 19px; font-weight: 800; }
.bigcode { font-family: var(--mono); font-size: 54px; font-weight: 700; letter-spacing: .18em; text-align: center; color: var(--red); padding: 10px 0; }

/* ---------- Actions ---------- */

  UI.draftSong = { id: "__preview", title: d.title || "Untitled song", composer: d.composer || "Unknown composer", key: +d.key, time: d.time, tags: d.tags, solfa: d.solfa, sheet: d.sheet, by: group().name };

};
ACT["save-song"] = function () {

  var p = parseSolfa(d.solfa, d.time);
  var hasSolfa = /[drmfslt]/.test(d.solfa.replace(/^\s*(\[.*\]|W\s.*)$/gm, "").replace(/^\s*\S+/gm, ""));

  else { s = { id: uid("s"), title: d.title.trim(), composer: d.composer.trim() || "Unknown composer", key: +d.key, time: d.time, tags: d.tags, solfa: hasSolfa ? d.solfa : "", sheet: d.sheet, by: isPersonal() ? me().name : g.name }; S.songs.unshift(s); g.repertoire.push(s.id); }
  save(); UI.player = null; UI.stack = [{ name: "songs", params: {} }]; UI.route = { name: "song", params: { id: s.id } }; render(true);
  toast("Saved. Everyone on Abụ can now find this song.");
};

ACT.perform = function (t) { if (A.playing) stopPlay(); UI.player = null; go("perform", { id: t.dataset.id, i: 0 }); };
ACT.rehearse = function (t) { UI.player = null; go("rehearse", { id: t.dataset.id, i: 0 }); };
ACT["perf-size"] = function (t) { UI.perfSize = Math.max(0, Math.min(3, (UI.perfSize == null ? 1 : UI.perfSize) + +t.dataset.d)); render(); };

ACT["write-guide"] = function () { UI.write.guide = !UI.write.guide; render(); };

ACT["write-play"] = function () {
  if (A.playing) { stopPlay(); UI.write.now = -1; drawWrite(); return; }
  var txt = writeSolfa(), p = parseSolfa(txt, UI.draft.time);
  if (!txt || !p.total) { toast("Write a few notes first."); return; }
  UI.player = newPlayer({ id: "__write", title: "Draft", key: +UI.draft.key, time: UI.draft.time, solfa: txt }, p); UI.player.focus = false; startPlay();
};
ACT["write-done"] = function () {
  var txt = writeSolfa(); if (A.playing) stopPlay();
  if (txt) { UI.draft.solfa = txt; UI.draft.sheet = "Handwritten manuscript (" + UI.write.bars + " bars)"; }
  back(); toast(txt ? "Converted. Check the sol-fa, then preview or save. Your handwriting is kept as the original." : "Nothing written yet.");
};
ACT["fix-oct"] = function (t) { UI.fixOct = +t.dataset.o; render(); };
ACT["fix-set"] = function (t) { var W = UI.write, k = UI.sheet.lane, b = UI.sheet.beat; wSnap(); if (t.dataset.v === "") delete W.typed[k][b]; else W.typed[k][b] = t.dataset.v; delete W.unsure[k + b]; UI.sheet = null; render(); };
ACT["fix-word"] = function () { var W = UI.write, v = val("fxWord").trim(), b = UI.sheet.beat; wSnap(); if (v) W.typed.W[b] = v; else delete W.typed.W[b]; delete W.unsure["W" + b]; UI.sheet = null; render(); };
ACT["fix-clear"] = function () { var W = UI.write, k = UI.sheet.lane, b = UI.sheet.beat; wSnap(); W.strokes = W.strokes.filter(function (s) { return !(s.lane === k && s.beat === b); }); delete W.typed[k][b]; delete W.unsure[k + b]; UI.sheet = null; render(); };
ACT["perf-theme"] = function (t) { S.prefs = S.prefs || {}; S.prefs.perfLight = t.dataset.v === "light"; save(); render(); };
ACT["perf-parts"] = function (t) { UI.perfMine = t.dataset.v === "mine"; render(); };
ACT["perf-nav"] = function (t) { if (A.playing) stopPlay(); var r = UI.route; r.params.i = Math.max(0, Math.min(ev(r.params.id).items.length - 1, (r.params.i || 0) + +t.dataset.d)); UI.player = null; render(true); };
ACT.rsvp = function (t) { var e = ev(UI.route.params.id); e.rsvp[S.me] = t.dataset.v; save(); render(); toast(t.dataset.v === "going" ? "Thanks. See you there." : "Got it. Your leader will see you as excused."); };
ACT["do-checkin"] = function () {
  var e = ev(UI.route.params.id), v = val("ciCode").trim();
  if (v !== e.code) { document.getElementById("ciErr").textContent = v ? "That code doesn’t match. Check the code your leader is showing." : "Enter the 4-digit code."; return; }
  e.attendance[S.me] = "present"; e.rsvp[S.me] = "going"; save(); UI.sheet = null; render(); toast("You’re checked in. Enjoy rehearsal!");
};
ACT["new-code"] = function () { var e = ev(UI.route.params.id); e.code = String(1000 + Math.floor(Math.random() * 9000)); save(); render(); };
ACT["att-filter"] = function (t) { UI.attFilter = t.dataset.f; render(); };
ACT["cycle-att"] = function (t) {
  var e = ev(UI.route.params.id), id = t.dataset.u, cur = e.attendance[id] || (e.rsvp[id] === "cant" ? "excused" : "");
  var next = { "": "present", present: "absent", absent: "excused", excused: "present" }[cur];

};

  var e = ev(UI.route.params.id), n = 0;
  group().members.forEach(function (m) { if (!canMark(m)) return; if (!e.attendance[m.userId]) { e.attendance[m.userId] = e.rsvp[m.userId] === "cant" ? "excused" : "present"; n++; } });
  save(); render(); toast(n ? n + " marked. Change anyone who isn’t here." : "Everyone you can mark is already marked.");
};

ACT["copy-code"] = function () { var c = group().code; var done = function () { toast("Invite code " + c + " copied."); }; try { navigator.clipboard.writeText("Join " + group().name + " on Abụ with code " + c).then(done, function () { toast("Share this code: " + c); }); } catch (e) { toast("Share this code: " + c); } };
ACT["post-notice"] = function () { var t = val("ntText").trim(); if (!t) { document.getElementById("ntErr").textContent = "Write a message first."; return; } group().notices.unshift({ id: uid("n"), by: S.me, date: TODAY, text: t }); save(); UI.sheet = null; render(); toast("Notice posted to everyone."); };
ACT["save-profile"] = function () { myMember().part = val("prPart"); save(); UI.sheet = null; UI.player = null; render(); toast("Your part is now " + myMember().part + "."); };
ACT["switch-space"] = function (t) { S.groupId = t.dataset.id; save(); UI.sheet = null; UI.player = null; UI.stack = []; go("home", {}, true); toast("Now in " + group().name + "."); };
ACT["do-join"] = function () {
  var code = val("jgCode").trim().toUpperCase(), e = document.getElementById("jgErr");
  if (!code) { e.textContent = "Enter the 6-letter code."; return; }
  var g = Object.keys(S.groups).map(function (k) { return S.groups[k]; }).filter(function (x) { return x.code === code; })[0];
  if (!g) { e.textContent = "No group has the code " + code + ". Check it with the leader."; return; }
  if (!g.members.some(function (m) { return m.userId === S.me; })) g.members.push({ userId: S.me, part: myMember().part, role: "member", joined: TODAY });
  S.groupId = g.id; save(); UI.sheet = null; UI.stack = []; go("home", {}, true); toast("Welcome to " + g.name + "! Switch back to My space from your profile.");
};

function val(id) { var el = document.getElementById(id); return el ? el.value : ""; }

document.addEventListener("click", function (e) {
  var t = e.target.closest("[data-act]"); if (!t) return;
  var a = t.dataset.act; if (!ACT[a]) return;
  if (a !== "scrim") e.preventDefault();

document.addEventListener("input", function (e) {
  var t = e.target;
  if (t.id === "songSearch") { UI.songQuery = t.value; var pos = t.selectionStart; render(); var s = document.getElementById("songSearch"); if (s) { s.focus(); try { s.setSelectionRange(pos, pos); } catch (x) {} } return; }
  if (t.dataset && t.dataset.draft && UI.draft) {
    UI.draft[t.dataset.draft] = t.dataset.draft === "key" ? +t.value : t.value;
    if (t.dataset.draft === "solfa" || t.dataset.draft === "time") { clearTimeout(window.__ck); window.__ck = setTimeout(function () { var c = document.getElementById("checks"); if (c) c.innerHTML = checksHTML(); }, 200); }
  }
  if (t.id === "joinCode") { t.value = t.value.toUpperCase(); }
});

  var t = e.target;
  if (t.dataset && t.dataset.draft && UI.draft) { UI.draft[t.dataset.draft] = t.dataset.draft === "key" ? +t.value : t.value; var c = document.getElementById("checks"); if (c) c.innerHTML = checksHTML(); }
  if (t.dataset && t.dataset.actChange === "section") { ev(UI.route.params.id).items[+t.dataset.i].section = t.value; save(); }
  if (t.id === "edFile" && t.files && t.files[0]) { UI.draft.sheet = t.files[0].name; document.getElementById("fileName").textContent = t.files[0].name; }
});
document.addEventListener("submit", function (e) {
  e.preventDefault();
  var id = e.target.id;
  if (id === "joinForm") {
    var code = val("joinCode").trim().toUpperCase();
    var g = Object.keys(S.groups).map(function (k) { return S.groups[k]; }).filter(function (x) { return x.code === code; })[0];
    if (!code) { UI.joinErr = "Enter the 6-letter code from your leader."; render(); return; }
    if (!g) { UI.joinErr = "No group has the code " + code + ". Check it with your leader."; render(); return; }
    UI.joinErr = ""; go("joinProfile", { gid: g.id });
  }
  if (id === "profileForm") {
    var name = val("pfName").trim(); if (!name) { document.getElementById("pfErr").textContent = "Enter your name so your leader knows who joined."; return; }
    var part = document.querySelector("[data-act=pick-part].on").dataset.part, gid = UI.route.params.gid, nid = uid("u");
    S.users[nid] = { id: nid, name: name }; S.groups[gid].members.push({ userId: nid, part: part, role: "member", joined: TODAY });
    S.me = nid; S.groupId = gid; save(); go("home", {}, true); toast("Welcome to " + S.groups[gid].name + "!");
  }
  if (id === "soloForm") {
    var sn = val("soName").trim(); if (!sn) { document.getElementById("soErr").textContent = "Enter your name."; return; }
    var spart = document.querySelector("[data-act=pick-part].on").dataset.part, sid = uid("u"), pid = "p-" + sid;

    S.me = sid; S.groupId = pid; save(); go("home", {}, true); toast("Welcome, " + sn.split(" ")[0] + "! Every song on Abụ is open to you.");
  }
  if (id === "createForm") {
    var gname = val("cgName").trim(), mine = S.me ? S.users[S.me].name : val("cgMe").trim();
    if (!gname || !mine) { document.getElementById("cgErr").textContent = !gname ? "Give your group a name." : "Enter your name."; return; }
    var gidN = uid("g"), uidN = uid("u"), p = val("cgPart"), letters = gname.replace(/[^A-Za-z]/g, "").toUpperCase();
    if (S.me) uidN = S.me; else S.users[uidN] = { id: uidN, name: mine };
    S.groups[gidN] = { id: gidN, name: gname, type: UI.createDraft.type, code: (letters + "XYZ").slice(0, 3) + String(100 + Math.floor(Math.random() * 900)), selfCheckIn: false,
      members: [{ userId: uidN, part: PARTS.indexOf(p) >= 0 ? p : "Soprano", role: "leader", joined: TODAY }], repertoire: [], notices: [], events: [] };
    S.me = uidN; S.groupId = gidN; UI.createDraft = null; save(); go("home", {}, true); toast(gname + " is ready. Share the invite code from the Group tab.");
  }
  if (id === "eventForm") {
    var kind = document.querySelector("[data-act=ev-kind].on").dataset.k, title = val("evTitle").trim();

    var ne = { id: uid("e"), kind: kind, title: title, date: val("evDate") || TODAY, time: val("evTime") || "08:00", venue: val("evVenue").trim() || "To be confirmed", note: val("evNote").trim(), items: [], rsvp: {}, attendance: {}, code: String(1000 + Math.floor(Math.random() * 9000)) };
    group().events.push(ne); save(); UI.stack = [{ name: "events", params: {} }]; UI.route = { name: "event", params: { id: ne.id } }; UI.editingOrder = true; render(true);
  }
});

render(true);
