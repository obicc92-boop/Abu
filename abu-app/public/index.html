<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- Fixed at the phone's own size, like an app (owner's report, 21 November 2026: the screen "shaking", moving
         left and right, up and down): a pinch or a quick double touch on the sol-fa keys zoomed the page a little,
         and from then on it slid about under a finger. SolfaScores has its own bigger text where it matters
         (Perform's A+). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no" />
    <meta name="theme-color" content="#18181B" />
    <script>
      // SolfaScores lives at solfascores.com. A browser on the old address (abu.adalingo.workers.dev)
      // or on www goes there, to the same page. Not the app installed from the old address, which
      // keeps working there (offline too) until it's installed again from solfascores.com.
      try {
        var h = location.hostname;
        var old = /\.workers\.dev$/.test(h) || h === 'www.solfascores.com';
        var installed = window.matchMedia && matchMedia('(display-mode: standalone)').matches;
        if (old && (h === 'www.solfascores.com' || (!installed && navigator.onLine !== false))) {
          location.replace('https://solfascores.com' + location.pathname + location.search + location.hash);
        }
      } catch (e) {}
    </script>
    <!-- Light (white) and dark (black): the page follows the phone unless SolfaScores' own setting (Me → Appearance) says otherwise. -->
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        // Light or dark as picked in Me, or as the five looks of 21 November 2026 left it (White was light).
        var t = localStorage.getItem('abu.theme');
        var l = localStorage.getItem('abu.look');
        if (!t && l) t = l === 'white' ? 'light' : 'dark';
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <!-- Installable: Android offers "Install app"; iPhones use Share, then "Add to Home Screen". -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SolfaScores" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      /* Android Chrome hides its address bar as you scroll, which makes the
         screen taller than "100%" (that's measured with the bar showing).
         100dvh follows the bar, so the app always reaches the bottom of the
         screen. Older browsers keep 100%. */
      @supports (height: 100dvh) {
        html,
        body {
          height: 100dvh;
        }
      }
      /* The page itself never moves: no pinch-zoom (iPhones ignore user-scalable=no; touch-action covers them),
         no pull-to-refresh dragging it down, no bounce. Each screen scrolls inside. */
      html,
      body {
        touch-action: pan-x pan-y;
        overscroll-behavior: none;
      }
      body {
        overflow: hidden;
        margin: 0;
        /* The app's page colour, so nothing red shows around it (the red first
           paint below has its own background): white, or black in dark. */
        background: #fbfaf8;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']) body {
          background: #111113;
        }
      }
      html[data-theme='dark'] body {
        background: #111113;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Shown until the app loads: the same screen and s:s mark as the splash,
         the welcome screen's night (near-black, an orange glow from the top
         right and a pink one from below), so slow connections never see a
         blank page. */
      #first-paint {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle 85vmax at 95% -20%, rgba(240, 106, 44, 0.5), rgba(240, 106, 44, 0)),
          radial-gradient(circle 60vmax at 70% 125%, rgba(226, 69, 122, 0.28), rgba(226, 69, 122, 0)),
          #18181b;
      }
    </style>
  </head>
